[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "route53-cloudflare-migration"
version = "1.0.0"
description = "Convert AWS Route53 exports into a deterministic zones.json for Cloudflare/Terraform."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "jsonschema>=4.0",
]

[project.optional-dependencies]
# boto3 is only needed if you use the (optional) Python exporter path; the
# default export path uses the AWS CLI + scripts/export_route53.sh.
export = ["boto3>=1.34"]
# The AI migration agent (migration/agent). Only the LLM harness needs this;
# the pure analysis helpers and their tests have no third-party dependency.
agent = ["anthropic>=0.116"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "jsonschema>=4.0",
]

[project.scripts]
route53-migrate = "migration.cli:main"

[tool.setuptools]
packages = ["migration", "migration.agent"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["migration"]
# The agent's LLM harness (runner/tools/CLI) requires the optional 'agent'
# extra plus a live Anthropic API key, subprocess tools (aws/dig), and network,
# so it is integration surface rather than unit-testable pure logic. The
# deterministic logic it relies on lives in migration/agent/analysis.py, which
# IS covered. Omit the harness for the same reason __main__.py is omitted.
omit = [
  "migration/__main__.py",
  "migration/agent/__main__.py",
  "migration/agent/prompt.py",
  "migration/agent/runner.py",
  "migration/agent/tools.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]
