name: Terraform Apply

# Production apply is MANUAL ONLY. It never runs on push. It requires a protected
# GitHub Environment ("production") whose required reviewers must approve the run
# before any Cloudflare change is made.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "apply" to confirm you intend to change production DNS.'
        required: true
        type: string

permissions:
  contents: read

# Never run two applies against the same state concurrently.
concurrency:
  group: tf-apply-production
  cancel-in-progress: false

jobs:
  apply:
    name: Terraform apply (production)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Validate confirmation input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "apply" ]; then
            echo "Confirmation input was not 'apply'; aborting."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform plan
        working-directory: terraform
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: terraform plan -input=false -lock-timeout=120s -out=tfplan

      # -auto-approve is acceptable here ONLY because the protected environment
      # gate above already required a human approval before this job could run,
      # and we apply the exact plan produced immediately above.
      - name: Terraform apply
        working-directory: terraform
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: terraform apply -input=false -lock-timeout=120s -auto-approve tfplan

      - name: Deployment summary
        if: always()
        working-directory: terraform
        run: |
          {
            echo "## Terraform apply"
            echo "- Ref: \`${{ github.sha }}\`"
            echo "- Actor: @${{ github.actor }}"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
