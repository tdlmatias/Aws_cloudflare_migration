name: Route53 Export

# Manually exports Route53 into zones.json using short-lived AWS credentials via
# GitHub OIDC (no long-lived AWS access keys). The result is uploaded as an
# artifact for review; it is NOT committed automatically, so a human always
# reviews the diff before it reaches Terraform.
on:
  workflow_dispatch:
    inputs:
      in_scope_file:
        description: >-
          Path to a file of in-scope domains (one per line). If the file exists,
          hosted zones outside it are routed to manual review instead of
          migrated. Leave the default and commit that file to enforce scope.
        required: false
        default: "config/in-scope-zones.txt"

permissions:
  contents: read
  id-token: write # required for AWS OIDC

concurrency:
  group: route53-export
  cancel-in-progress: true

jobs:
  export:
    name: Export Route53 to zones.json
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: export
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e "."

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          # Configure a read-only Route53 role that trusts this repository's
          # OIDC subject. See docs/SECURITY_MODEL.md for the trust policy and
          # the minimal IAM permissions.
          role-to-assume: ${{ secrets.AWS_ROUTE53_READONLY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Export Route53
        env:
          IN_SCOPE_FILE_INPUT: ${{ github.event.inputs.in_scope_file }}
        run: |
          # A non-empty in_scope_file expresses intent to enforce scope, so a
          # missing/mistyped path must FAIL rather than silently migrate every
          # zone. Only an explicitly blank input opts out of the allowlist.
          if [ -n "${IN_SCOPE_FILE_INPUT}" ]; then
            if [ ! -f "${IN_SCOPE_FILE_INPUT}" ]; then
              echo "::error::in_scope_file '${IN_SCOPE_FILE_INPUT}' not found. Commit that file, or clear the input to migrate every public zone."
              exit 1
            fi
            export IN_SCOPE_ZONES_FILE="${IN_SCOPE_FILE_INPUT}"
            echo "::notice::Enforcing in-scope allowlist from ${IN_SCOPE_FILE_INPUT}; out-of-scope zones go to manual review."
          else
            echo "::notice::in_scope_file is blank; migrating every public zone (no scope allowlist)."
          fi
          ./scripts/export_route53.sh terraform/data

      - name: Upload export artifact
        uses: actions/upload-artifact@v7
        with:
          name: route53-export-${{ github.run_id }}
          path: |
            terraform/data/zones.json
            terraform/data/manual-review.json
          retention-days: 7
          if-no-files-found: error
