name: STAGING

# Satisfies the branch-protection rule "Require deployments to succeed before
# merging" for the STAGING environment. It performs non-destructive Terraform
# validation only (no apply, no secrets), so the STAGING deployment reliably
# succeeds without touching infrastructure.
#
# Triggered on `push` (not `pull_request`) on purpose: the "require deployments"
# rule evaluates deployments on the PR's head commit, but a pull_request-event
# job records its environment deployment against the synthetic merge ref, so the
# gate never sees an active deployment on the head and merging stays blocked.
# A push-event job runs with github.sha == the branch head, so the STAGING
# deployment lands exactly on the commit the gate checks. main is excluded
# because it is never merged into itself.
on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staging:
    name: Validate (STAGING)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The `environment:` key is what registers a STAGING deployment for the gate.
    environment: STAGING
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        working-directory: terraform
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform test (mock providers)
        working-directory: terraform
        run: terraform test
