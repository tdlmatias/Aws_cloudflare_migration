name: Terraform Plan

# Produces a non-destructive, reviewable plan for pull requests and pushes to
# main. Never applies. The plan is uploaded as an artifact for human review
# before a protected apply.
on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-plan.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"

permissions:
  contents: read

concurrency:
  group: tf-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Read-only Cloudflare token lives in a non-production environment so plans
    # can refresh state without any ability to apply.
    environment: plan
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # secrets are not available in job-level `if:`, so detect them in a step
      # and gate the plan on the result. Before the Cloudflare credentials are
      # configured in the `plan` environment, the plan is skipped (green) with a
      # notice; once the secrets exist, a full plan runs automatically.
      - name: Check for Cloudflare credentials
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare credentials are not configured in the 'plan' environment; skipping terraform plan. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to run a full reviewable plan."
          fi

      - name: Set up Terraform
        if: steps.creds.outputs.present == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Terraform init
        if: steps.creds.outputs.present == 'true'
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform plan
        if: steps.creds.outputs.present == 'true'
        working-directory: terraform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: terraform plan -input=false -lock-timeout=60s -out=tfplan

      - name: Upload plan artifact
        if: steps.creds.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ github.sha }}
          path: terraform/tfplan
          retention-days: 5
          if-no-files-found: error
